  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a8ebc087b2fcd70fcbeb8a" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="js/webflow.js" type="text/javascript"></script>

  <script>
  $(document).ready(function() {
    // UPDATED: Using the new ID to ensure no interference
    $('#contact-form-custom').submit(function(e) {
      e.preventDefault();
      
      const $form = $(this);
      const $submitBtn = $form.find('input[type="submit"]');
      const $success = $('.contact-success-message');
      const $error = $('.contact-error-message');
      
      // UPDATED: Standardized URL with trailing slash to match form action
      const action = "https://submit-form.r-saeedi.workers.dev/";

      const originalBtnText = $submitBtn.val();
      $submitBtn.val($submitBtn.attr('data-wait') || "Sending...").prop('disabled', true);

      $.ajax({
        type: "POST",
        url: action,
        data: $form.serialize(), 
        success: function(response) {
          $form.fadeOut(300, function() {
            $success.show();
          });
          $error.hide();
        },
        error: function(xhr) {
          console.error("Submission Error:", xhr);
          const errorMsg = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Something went wrong.";
          alert(errorMsg);
          
          $error.show();
          $submitBtn.val(originalBtnText).prop('disabled', false);
          
          if (typeof turnstile !== 'undefined') {
            turnstile.reset();
          }
        }
      });
    });
  });
  </script>
