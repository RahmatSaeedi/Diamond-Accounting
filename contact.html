<!DOCTYPE html>
<html data-wf-page="67a8ebc187b2fcd70fcbef2f" data-wf-site="67a8ebc087b2fcd70fcbeb8a" lang="en">
<head>
  <meta charset="utf-8">
  <title>Diamond Tax &amp; Accounting Services - Contact us</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/diamond-tax.webflow.css" rel="stylesheet" type="text/css">
  
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- We removed the CSP Meta Tag here to resolve 'TrustedScript' and 'TrustedHTML' assignment blocks -->
  
  <script type="text/javascript">
      ! function(o, c) {
        var n = c.documentElement, t = " w-mod-";
        n.className += t + "js", ("ontouchstart" in o || o.DocumentTouch && c instanceof DocumentTouch) && (n.className += t + "touch")
      }(window, document);
  </script>
</head>
<body>

  <!-- ... (Keep your Navbar and Hero sections exactly as they are) ... -->

  <section class="section">
    <div class="w-layout-blockcontainer container w-container">
      <div class="form-wrapper slide-up-animation w-form">
        
        <!-- IMPORTANT: Use this exact ID -->
        <form id="diamond-contact-form" name="email-form" method="post">
          <div class="field-wrapper">
            <label for="name" class="field-label">Name</label>
            <input class="text-field w-input" name="name" placeholder="e. g. John Doe" type="text" id="name" required>
          </div>
          <div class="field-wrapper">
            <label for="email" class="field-label">Email Address</label>
            <input class="text-field w-input" name="email" placeholder="e. g. johndoe@email.com" type="email" id="email" required>
          </div>
          <div class="field-wrapper">
            <label for="phone" class="field-label">Phone Number</label>
            <input class="text-field w-input" name="phone" placeholder="(123) - 456 - 789" type="tel" id="phone">
          </div>
          <div class="field-wrapper">
            <label for="message" class="field-label">Your Message</label>
            <textarea id="message" name="message" placeholder="Write Your Message Here" required class="message-area w-input"></textarea>
          </div>
          
          <input type="submit" id="submit-btn" value="Send Message" class="button w-button">
          
          <div class="cf-turnstile" data-sitekey="0x4AAAAAADIgv-SzBcp5dPm6"></div>
        </form>

        <div id="success-msg" class="contact-success-message w-form-done" style="display:none;">
          <div>Thank you! Your submission has been received!</div>
        </div>
        <div id="error-msg" class="contact-error-message w-form-fail" style="display:none;">
          <div>Oops! Something went wrong. Please try again.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ... (Keep your Footer) ... -->

  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js" type="text/javascript"></script>
  <script src="js/webflow.js" type="text/javascript"></script>

  <script>
  document.getElementById('diamond-contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const form = e.target;
    const btn = document.getElementById('submit-btn');
    const success = document.getElementById('success-msg');
    const error = document.getElementById('error-msg');
    const formData = new FormData(form);

    // Visual feedback
    btn.value = "Sending...";
    btn.disabled = true;

    // We use fetch() instead of jQuery $.ajax to bypass 'TrustedHTML' issues
    fetch("https://submit-form.r-saeedi.workers.dev/", {
      method: "POST",
      body: formData,
      mode: 'cors'
    })
    .then(response => {
      if (response.ok) {
        form.style.display = 'none';
        success.style.display = 'block';
        error.style.display = 'none';
      } else {
        throw new Error('Server responded with an error');
      }
    })
    .catch(err => {
      console.error("Submission error:", err);
      error.style.display = 'block';
      btn.value = "Send Message";
      btn.disabled = false;
      
      if (typeof turnstile !== 'undefined') {
        turnstile.reset();
      }
    });
  });
  </script>
</body>
</html>
